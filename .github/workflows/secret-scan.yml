name: secret-scan

permissions:
  contents: read
  # gitleaks-action annotates pull requests with findings
  pull-requests: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  # on-demand verification of a full-history scan (the schedule is weekly)
  workflow_dispatch:
  pull_request:
  push:
    # every branch — a secret on a feature branch has already reached the remote
    branches: ["**"]
  schedule:
    # weekly re-audit of full history on the PINNED core (see GITLEAKS_VERSION below;
    # rule updates arrive when the pin is bumped deliberately, not silently) — Mondays 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        # SHA-pinned: security-critical workflow must not follow floating tags
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      # gitleaks core is MIT; the action needs no GITLEAKS_LICENSE for personal-account
      # repositories (an organization repository WOULD require one). Config: .gitleaks.toml.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same pin as vuco: the action's default core (8.24.3) predates root-level
          # [[allowlists]] (needs >= 8.25) and silently ignores them. The pin freezes the
          # detection ruleset on purpose - bump it deliberately, and UNPIN once the action's
          # default core is >= 8.25 (check its releases).
          GITLEAKS_VERSION: "8.28.0"
