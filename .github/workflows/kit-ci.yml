name: kit-ci

permissions:
  contents: read

concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    # A release tag re-runs the suite on the tagged commit and checks the tag against package.json.
    tags: ["v*"]

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: A release tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package.json version (${expected})"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json"

      # Consumers install the kit anonymously from a github: tag. npm fetches the tag tarball and runs
      # nothing only while package.json defines none of these scripts.
      - name: No install-time scripts
        run: |
          node -e '
            const scripts = require("./package.json").scripts ?? {};
            const found = ["preinstall", "install", "postinstall", "prepare", "prepack"].filter((name) => name in scripts);
            if (found.length) {
              console.error(`::error::install-time scripts break the anonymous github: install: ${found.join(", ")}`);
              process.exit(1);
            }
            console.log("no install-time scripts");
          '

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # AR-20: every committed output must be regenerable from the token sources byte for byte.
      - name: Generated outputs match the token sources (staleness gate)
        run: node tokens/generate-tokens.mjs --check --brand vuco

      # AR-24: the money role needs tabular figures in every bundled weight.
      - name: Verify tnum (money font)
        run: node tokens/check-tnum.mjs

      - name: The package ships the five fonts, OFL.txt and tokens/out/vuco/*
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = new Set(require(process.argv[1])[0].files.map((file) => file.path));
            const required = ["Regular", "Medium", "SemiBold", "Bold", "ExtraBold"]
              .map((weight) => `tokens/fonts/PlusJakartaSans-${weight}.ttf`)
              .concat(["tokens/fonts/OFL.txt", "tokens/out/vuco/nativewind-theme.cjs", "tokens/out/vuco/tokens.css", "tokens/out/vuco/VucoDesignTokens.g.cs"]);
            const missing = required.filter((path) => !files.has(path));
            if (missing.length) {
              console.error(`::error::npm pack does not list ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`npm pack lists all ${required.length} required files`);
          ' "$RUNNER_TEMP/pack.json"

      - name: The tree is unchanged (verdict, outputs, nothing stray)
        # porcelain (not diff): an untracked file, such as a regenerated verdict or a stray output, fails too
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "::error::the run changed the tree"
            echo "$changed"
            exit 1
          fi
