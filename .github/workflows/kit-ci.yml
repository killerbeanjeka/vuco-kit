name: kit-ci

permissions:
  contents: read

concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
    # A release tag re-runs the suite on the tagged commit and checks the tag against package.json.
    tags: ["v*"]

jobs:
  kit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: A release tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package.json version (${expected})"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches package.json"

      # Consumers install the kit anonymously from a github: tag. npm fetches the tag tarball and runs
      # nothing only while package.json defines none of these scripts.
      - name: No install-time scripts
        run: |
          node -e '
            const scripts = require("./package.json").scripts ?? {};
            const found = ["preinstall", "install", "postinstall", "prepare", "prepack"].filter((name) => name in scripts);
            if (found.length) {
              console.error(`::error::install-time scripts break the anonymous github: install: ${found.join(", ")}`);
              process.exit(1);
            }
            console.log("no install-time scripts");
          '

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # AR-20: every committed output must be regenerable from the token sources byte for byte.
      - name: Generated outputs match the token sources (staleness gate)
        run: node tokens/generate-tokens.mjs --check --brand vuco

      # AR-24: the money role needs tabular figures in every bundled weight.
      - name: Verify tnum (money font)
        run: node tokens/check-tnum.mjs

      # The kit's own primitives follow the dual-mode rule every consumer's CI enforces.
      - name: Every dual-mode colour token in src is paired with its dark variant
        run: node tokens/check-dark-pairing.mjs --src src --allowlist dark-pairing-allowlist.json

      # Consumers import these files by path from the installed package, which holds only what npm packs.
      - name: The package ships the fonts, token outputs, UI primitives, i18n and base configs, and nothing else
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const files = new Set(require(process.argv[1])[0].files.map((file) => file.path));
            const primitives = ["ActionChip", "ActionRow", "Banner", "ButtonPrimary", "ButtonSecondary", "ChoiceChip", "ExplainerCard", "Input", "OptionRow", "ScreenFooter", "ScreenHeader", "SegmentedTabs", "Sheet", "bottomBarSpace", "icons"];
            const required = ["Regular", "Medium", "SemiBold", "Bold", "ExtraBold"]
              .map((weight) => `tokens/fonts/PlusJakartaSans-${weight}.ttf`)
              .concat(["tokens/fonts/OFL.txt", "tokens/out/vuco/nativewind-theme.cjs", "tokens/out/vuco/tokens.css", "tokens/out/vuco/VucoDesignTokens.g.cs"])
              .concat(primitives.map((name) => `src/ui/${name}.tsx`))
              .concat(["src/i18n/index.ts", "src/i18n/en.json", "src/i18n/de.json", "config/eslint.base.js", "config/tsconfig.base.json", "AGENTS.md"]);
            const missing = required.filter((path) => !files.has(path));
            if (missing.length) {
              console.error(`::error::npm pack does not list ${missing.join(", ")}`);
              process.exit(1);
            }
            // Only the published layout ships: an unexpected file under src/ reaches every consumer, and the
            // Tailwind content glob of every consumer scans all of src/. (No apostrophes in this script: it
            // sits inside a single-quoted shell string.)
            const layout = [
              /^(package\.json|README\.md|LICENSE|AGENTS\.md)$/,
              /^src\/ui\/[A-Za-z]+\.tsx$/,
              /^src\/i18n\/(index\.ts|[a-z]{2}\.json)$/,
              /^config\/(eslint\.base\.js|tsconfig\.base\.json)$/,
              /^tokens\//,
            ];
            const testLike = /(^|\/)(test|__tests__|__mocks__)\/|\.(test|spec)\.[cm]?[jt]sx?$/;
            const stray = [...files].filter((path) => testLike.test(path) || !layout.some((pattern) => pattern.test(path)));
            if (stray.length) {
              console.error(`::error::npm pack ships files outside the published layout: ${stray.join(", ")}`);
              process.exit(1);
            }
            console.log(`npm pack lists all ${required.length} required files and nothing outside the published layout`);
          ' "$RUNNER_TEMP/pack.json"

      - name: The tree is unchanged (verdict, outputs, nothing stray)
        # porcelain (not diff): an untracked file, such as a regenerated verdict or a stray output, fails too
        run: |
          changed="$(git status --porcelain)"
          if [ -n "$changed" ]; then
            echo "::error::the run changed the tree"
            echo "$changed"
            exit 1
          fi
